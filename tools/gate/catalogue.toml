# AminCustoms gate catalogue (Part 6 §6.13, P00-T03).
#
# Every [gate.NAME] entry MUST declare: cadence, command, timeout, activates_in,
# violation_fixture and clean_fixture. An entry without both fixture keys is a
# misconfiguration (exit 2). A fixture value of "" means "not yet implemented";
# selftest treats that as None and fails the gate until the fixture is provided
# (P00-T04 through P00-T12 fill these in).
#
# Fixture paths are relative to this file (tools/gate/catalogue.toml).
#
# Cadence codes: Q quick; P phase-end / pull-request; N nightly; R release.

# ---- P00 active gates with fixtures (P00-T03) -----------------------------

[gate.format]
cadence = "QP"
command = "ruff format --check"
timeout = 60
activates_in = "P00"
violation_fixture = "fixtures/format_violation.py"
clean_fixture = "fixtures/format_clean.py"

[gate.lint]
cadence = "QP"
command = "ruff check"
timeout = 60
activates_in = "P00"
violation_fixture = "fixtures/lint_violation.py"
clean_fixture = "fixtures/lint_clean.py"

[gate.types]
cadence = "QP"
command = "mypy ."
timeout = 120
activates_in = "P00"
violation_fixture = "fixtures/types_violation.py"
clean_fixture = "fixtures/types_clean.py"

[gate.unit]
cadence = "QP"
command = "pytest -m fast"
timeout = 300
activates_in = "P00"
violation_fixture = "fixtures/test_unit_violation.py"
clean_fixture = "fixtures/test_unit_clean.py"

[gate.selftest]
cadence = "P"
command = "python -m tools.gate.gates.selftest"
timeout = 300
activates_in = "P00"
violation_fixture = "fixtures/selftest_violation"
clean_fixture = "fixtures/selftest_clean"

