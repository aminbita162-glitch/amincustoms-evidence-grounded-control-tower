name: nightly
on:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      HYGIENE_PATTERNS: ${{ secrets.HYGIENE_PATTERNS }}
      HYGIENE_PATTERNS_VENDOR: ${{ secrets.HYGIENE_PATTERNS_VENDOR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: pip install uv
      - run: uv python install 3.14
      - run: uv sync --frozen --extra dev
      - run: uv run python -m tools.gate.install_gitleaks
      - run: uv run python -m tools.gate run nightly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: gate-logs
          path: .gate-logs
          include-hidden-files: true
