# Source: Part 7 section 7.2 (<<<P7-RISK>>>) section 11 (seed control targets).
# Each control is PLANNED with a target phase; the lifecycle status moves to
# IMPLEMENTED and then VERIFIED as the target phase completes and the
# verifying test ids are recorded. T06 completes the catalogue with controls
# for project risks, hazards, threats, model risks and data-legal risks.

