    source: P7-RISK section 8, V-01

  - id: CTL-DLR-02
    title: Dataset licence verification
    type: preventive
    mechanism: >-
      The data gate checks every dataset has a verified licence; the Source
      Registry records the licence summary (V-04).
    lifecycle_status: PLANNED
    target_phase: P02
    source: P7-RISK section 8, V-04

  - id: CTL-DLR-03
    title: Public-domain status verification
    type: detective
    mechanism: >-
      The data gate verifies the public-domain status of list data; the
      Source Registry records the status (V-05).
    lifecycle_status: PLANNED
    target_phase: P02
    source: P7-RISK section 8, V-05

  - id: CTL-DLR-04
    title: Official text validity check
    type: detective
    mechanism: >-
      The data gate checks the validity of official text; the source is
      verified as authoritative (V-07).
    lifecycle_status: PLANNED
    target_phase: P02
    source: P7-RISK section 8, V-07

  - id: CTL-DLR-05
    title: Secondary legal claims verification
    type: detective
    mechanism: >-
      The data gate verifies secondary legal claims against the primary
      source (V-08).
    lifecycle_status: PLANNED
    target_phase: P02
    source: P7-RISK section 8, V-08

  - id: CTL-DLR-06
    title: Privacy check for public list data
    type: preventive
    mechanism: >-
      The data gate checks the privacy of public list data; personal data is
      redacted before use (V-16).
    lifecycle_status: PLANNED
    target_phase: P02
    source: P7-RISK section 8, V-16
